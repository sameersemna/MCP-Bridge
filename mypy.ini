[mypy]
plugins = pydantic.mypy

# Baseline suppressions were added when mypy became a blocking CI gate (P2-05).
# Each targets one error code on one line; remove them as modules are typed.

# mcp 1.27 ships type changes faster than this codebase can absorb them (the
# upgrade alone moved the error count from 71 to 94 across SDK-facing modules).
# Treat the third-party SDK as untyped so our own signatures stay checked; this
# only affects the `mcp` package, not mcp_bridge.
[mypy-mcp.*]
follow_imports = skip
ignore_missing_imports = true
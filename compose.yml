services:
  mcp-bridge:
    build:
      context: .
    develop:
      watch:
        - path: mcp_bridge
          action: rebuild
    container_name: mcp-bridge
    network_mode: host
    extra_hosts:
      - "latitude:192.168.178.94"
      - "latitude.fritz.box:192.168.178.94"
    environment:    
      - OPENAI_STREAMING=false
      - STREAM=false
      - FORCE_NON_STREAMING=true
      - MCP_BRIDGE__CONFIG__FILE=/app/config.json
      - MCP_BRIDGE__TELEMETRY__ENABLED=true
      - MCP_BRIDGE__TELEMETRY__OTEL_ENDPOINT=http://127.0.0.1:4318/v1/traces
      - MCP_BRIDGE__TELEMETRY__SERVICE_NAME=mcp-bridge
      - MCP_BRIDGE_MAX_SEARCH_RESULTS=20
      - MCP_BRIDGE_MAX_TOOL_TURNS=30
      - MCP_BRIDGE_TOOL_TIMEOUT_SECONDS=600
      - MCP_BRIDGE_TOOL_RETRY_COUNT=1
      - MCP_BRIDGE_TOOL_RETRY_DELAY_SECONDS=0.25
      - MCP_BRIDGE_TOOL_DISCOVERY_TIMEOUT_SECONDS=180
      - DEFAULT_MCP_SESSION_TIMEOUT_SECONDS=180
      - DEFAULT_MCP_DISCOVERY_TIMEOUT_SECONDS=180
      # - MCP_BRIDGE__CONFIG__HTTP_URL=http://10.88.100.170:8888/config.json
      # - MCP_BRIDGE__CONFIG__JSON=
    volumes:
      - ./config.json:/app/config.json
      - ./logs:/app/logs
      - ./tmp:/tmp
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:latest
    ports:
      - "16686:16686"   # Web UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      # - "5778:5778"     # Config server
      # - "9411:9411"     # Zipkin compatible
    restart: unless-stopped